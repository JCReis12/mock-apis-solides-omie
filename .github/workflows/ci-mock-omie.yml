name: CI Mock Omie

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: mock-omie
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar endpoints do mock Omie
        run: |
          base_url=http://127.0.0.1:8000
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --max-time 5 "$base_url/openapi.json" > /dev/null

          query='colaborador_cpf=12345678900&periodo=2026-10'
          curl --fail --silent --show-error --max-time 5 "$base_url/omie/despesas?$query" \
            | jq -e '.quantidade_lancamentos == 3 and (.despesas | length == 3) and .total_despesas_variaveis == 1645.50' > /dev/null
          curl --fail --silent --show-error --max-time 5 "$base_url/omie/fechamento-consolidado?$query" \
            | jq -e '.total_geral_variavel == 1645.50 and (.resumo_por_categoria | length > 0)' > /dev/null

          status=$(curl --silent --show-error --max-time 5 --output /dev/null \
            --write-out '%{http_code}' "$base_url/omie/despesas?colaborador_cpf=123&periodo=2026-10")
          test "$status" = 400
